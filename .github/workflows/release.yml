name: Release

# Publishes to npm when a GitHub Release is published (tag `vX.Y.Z` matching package.json).
# Uses npm trusted publishing (OIDC): no npm token is stored in the repo, and the
# package gets a provenance statement linking it to this workflow run.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5+.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm publish --provenance --access public
